name: china_ready
description: A student companion app for China.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  provider: ^6.0.5
  intl: ^0.18.1
  flutter_svg: ^2.0.9
  firebase_core: ^2.24.2
  firebase_storage: ^11.6.0
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
